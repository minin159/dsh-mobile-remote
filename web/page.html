<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>DSH 远程</title>
<style>
  /* 暗色跟随系统；亮色用同一套变量翻转。安全区适配 iPhone 底部横条。 */
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1a1d24; --muted: #6b7280;
    --line: rgba(0,0,0,.08); --accent: #4d6bfe; --ok: #16a34a; --bad: #dc2626;
    --bubble-user: #4d6bfe; --bubble-user-ink: #fff; --bubble-ai: #ffffff;
    --warn-bg: #fef3c7; --warn-ink: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --panel: #1b1e26; --ink: #e5e7eb; --muted: #9ca3af;
      --line: rgba(255,255,255,.09); --bubble-ai: #1f232e;
      --warn-bg: #3a2f10; --warn-ink: #fbbf24;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px;
    display: flex; flex-direction: column;
  }
  /* ── 顶部状态栏 ─────────────────────────────────────── */
  #topbar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) 12px 6px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 20;
  }
  #connDot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
  #connDot.ok { background: var(--ok); } #connDot.bad { background: var(--bad); }
  #connText { font-size: 13px; color: var(--muted); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); flex-shrink: 0; }
  .chip.run { color: var(--ok); border-color: var(--ok); }
  #rebindBtn { border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 8px; font-size: 13px; padding: 3px 9px; flex-shrink: 0; }
  /* ── 横幅（停止/顶替）────────────────────────────────── */
  .banner {
    display: none; padding: 10px 14px; font-size: 13px; line-height: 1.5;
    background: var(--warn-bg); color: var(--warn-ink);
  }
  .banner.show { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .banner button { border: 1px solid currentColor; background: transparent; color: inherit;
    border-radius: 8px; padding: 4px 12px; font-size: 13px; }
  /* ── 审批条 ─────────────────────────────────────────── */
  #approvalBar {
    display: none; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 12px; z-index: 15;
  }
  #approvalBar.show { display: block; }
  #apHead { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  #apTimer { margin-left: auto; font-size: 12px; color: var(--bad); font-variant-numeric: tabular-nums; }
  #apReason { margin: 5px 0 8px; font-size: 12.5px; color: var(--muted);
    max-height: 5.2em; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  #apQueue { font-size: 11px; color: var(--muted); }
  .apBtns { display: flex; gap: 10px; }
  .apBtns button { flex: 1; border: 0; border-radius: 10px; padding: 10px 0; font-size: 15px; font-weight: 600; }
  #apAllow { background: var(--ok); color: #fff; }
  #apReject { background: var(--bad); color: #fff; }
  .apBtns button:disabled { opacity: .5; }
  /* ── 消息流 ─────────────────────────────────────────── */
  #stream { flex: 1; overflow-y: auto; padding: 12px 10px 8px; -webkit-overflow-scrolling: touch; }
  .row { display: flex; margin: 6px 0; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 86%; border-radius: 14px; padding: 8px 12px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; font-size: 14.5px;
    background: var(--bubble-ai); border: 1px solid var(--line);
  }
  .row.me .bubble { background: var(--bubble-user); color: var(--bubble-user-ink); border: 0; }
  .meta { font-size: 10.5px; color: var(--muted); margin: 2px 6px; }
  .row.me .meta { text-align: right; }
  .sys { text-align: center; font-size: 11px; color: var(--muted); margin: 8px 0; }
  .tool { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 10px; margin: 4px 0; display: flex; gap: 6px; align-items: baseline; }
  .tool .tname { color: var(--ink); font-weight: 600; flex-shrink: 0; }
  .tool .targs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tool.err .tname { color: var(--bad); }
  .thinking { font-size: 12px; color: var(--muted); font-style: italic; margin: 4px 6px; }
  #newMsg {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 7px 16px; font-size: 13px; display: none; z-index: 18; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #newMsg.show { display: block; }
  /* ── 底部输入区 ─────────────────────────────────────── */
  #composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--panel);
  }
  #input {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--ink); font: inherit; padding: 9px 12px;
    max-height: 120px; line-height: 1.4;
  }
  #sendBtn {
    border: 0; border-radius: 12px; background: var(--accent); color: #fff;
    font-size: 14.5px; font-weight: 600; padding: 10px 16px; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: .45; }
  #hintBar { text-align: center; font-size: 12px; color: var(--muted); padding: 18px 20px; line-height: 1.7; }
  /* 轻提示 */
  #toast {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.78); color: #fff; font-size: 13px; border-radius: 999px;
    padding: 7px 16px; z-index: 40; display: none; max-width: 86vw; text-align: center;
  }
</style>
</head>
<body>

<header id="topbar">
  <div id="connDot"></div>
  <div id="connText">连接中…</div>
  <div id="agentChip" class="chip">—</div>
  <button id="rebindBtn" title="断开并重新绑定电脑当前会话">⟳ 换绑</button>
</header>

<div id="stoppedBanner" class="banner">
  <span>电脑端已停止远程控制</span>
  <button id="resumeBtn">重新连接</button>
</div>
<div id="replacedBanner" class="banner">
  <span>本页面已在其他设备打开，连接被顶替</span>
  <button id="takeoverBtn">夺回连接</button>
</div>

<div id="approvalBar">
  <div id="apHead"><span>🔐 审批请求</span><span id="apQueue"></span><span id="apTimer"></span></div>
  <div id="apTool" style="font-weight:600"></div>
  <div id="apReason"></div>
  <div class="apBtns">
    <button id="apAllow">允许</button>
    <button id="apReject">拒绝</button>
  </div>
</div>

<main id="stream"></main>
<button id="newMsg">↓ 新消息</button>
<div id="toast"></div>

<footer id="composer">
  <textarea id="input" rows="1" placeholder="发消息给当前会话…"></textarea>
  <button id="sendBtn">发送</button>
</footer>

<script>
'use strict';
// ── 基础状态 ─────────────────────────────────────────────────────────────
// token 即配对码：来自页面路径段（/mobile-remote/p/<token>），所有接口调用都带上。
var token = (location.pathname.split('/p/')[1] || '').replace(/\/+$/, '');
var $ = function (id) { return document.getElementById(id); };
var streamEl = $('stream');
var state = {
  seq: 0,            // 已消费到的全局事件号（SSE id），断点补发游标
  epoch: null,       // 服务器启动纪元：变化说明服务器重启过，游标作废
  es: null,          // EventSource
  backoff: 1000,     // 重连退避 1s→10s 封顶
  noAuto: false,     // 被顶替/被停止后停止自动重连
  throttleSec: 2,
  waitSec: 120,
  sessionId: null,
  agentStatus: null,
  approvals: [],     // 待处理审批队列
  apTimer: null, apLeft: 0,
  nearBottom: true,
  sendLockUntil: 0,
};
// 游标持久化：安卓息屏回前台走整页重载（P5 实测），靠 sessionStorage 带回断点。
try {
  state.seq = parseInt(sessionStorage.getItem('mr-seq') || '0', 10) || 0;
  state.epoch = sessionStorage.getItem('mr-epoch');
} catch (e) {}

function saveCursor() {
  try {
    sessionStorage.setItem('mr-seq', String(state.seq));
    sessionStorage.setItem('mr-epoch', state.epoch || '');
  } catch (e) {}
}

// ── 小工具 ───────────────────────────────────────────────────────────────
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.style.display = 'none'; }, 2600);
}
function fmtTime() {
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function nearBottom() {
  return streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 60;
}
function afterAppend(force) {
  if (force || state.nearBottom) {
    streamEl.scrollTop = streamEl.scrollHeight;
    $('newMsg').classList.remove('show');
  } else {
    $('newMsg').classList.add('show');
  }
}
/** 用户/助手消息的文本提取：content 块数组里取 text 块（其余类型由专属事件渲染）。 */
function contentText(content) {
  if (typeof content === 'string') return content;
  var out = '';
  if (Array.isArray(content)) {
    for (var i = 0; i < content.length; i++) {
      var b = content[i] || {};
      if ((b.kind || b.type) === 'text' && typeof b.text === 'string') {
        out += (out ? '\n' : '') + b.text;
      }
    }
  }
  return out;
}
/** 生成一条助手流式气泡（按 turn:step 归并 text-delta）。 */
var streamingBubbles = {};
function streamBubble(turn, step) {
  var key = turn + ':' + step;
  var b = streamingBubbles[key];
  if (!b || !b.el.parentNode) {
    var el = document.createElement('div');
    el.className = 'row';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    el.appendChild(bubble);
    streamEl.appendChild(el);
    b = { el: el, bubble: bubble, text: '' };
    streamingBubbles[key] = b;
  }
  return b;
}

// ── 会话事件渲染 ─────────────────────────────────────────────────────────
function handleSession(ev) {
  var type = ev.type || '';
  var data = ev.data || {};
  if (ev.clipped) {
    // 超长帧被服务器瘦身：文本已由 assistant/chunk 增量送达，最终消息只做收尾。
    if (type === 'assistant/message') { finishStreaming(data.turn, data.step, null); }
    return;
  }
  switch (type) {
    case 'user/message': {
      var src = data.source || {};
      var who = src.kind === 'plugin' ? '📱 ' + (src.plugin || '插件') : '💻 电脑';
      var text = contentText(data.content || (data.message && data.message.content));
      addBubble('me', text, who + ' · ' + fmtTime(), true);
      break;
    }
    case 'assistant/chunk': {
      var chunk = data.chunk || {};
      if (chunk.type === 'text-delta' && typeof chunk.text === 'string' && chunk.text) {
        var b = streamBubble(data.turn, data.step);
        b.text += chunk.text;
        b.bubble.textContent = b.text;
        afterAppend();
      } else if (chunk.type === 'reasoning-delta') {
        showThinking();
      }
      break;
    }
    case 'assistant/message': {
      var finalText = contentText(data.message && data.message.content);
      finishStreaming(data.turn, data.step, finalText);
      break;
    }
    case 'tool/call':
      addToolLine(data.callId, data.name, data.arguments);
      break;
    case 'tool/result': {
      var ok = !(data.message && data.message.isError);
      markToolResult(data.message && data.message.callId, ok);
      break;
    }
    case 'turn/start':
      addSys('── 新回合 ──');
      break;
    case 'approval/asked':
      addSys('🔐 请求审批：' + (data.toolName || '?'));
      break;
    case 'approval/decided':
      addSys((String(data.outcome).indexOf('allowed') === 0 ? '✅ 已允许：' : '⛔ 审批结果：') + String(data.outcome));
      break;
    default:
      break; // 未知类型：静默（协议向前兼容）
  }
}
function addBubble(side, text, meta, forceScroll) {
  if (!text) return;
  var row = document.createElement('div');
  row.className = 'row' + (side === 'me' ? ' me' : '');
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text; // textContent 防注入
  var m = document.createElement('div');
  m.className = 'meta';
  m.textContent = meta || '';
  row.appendChild(bubble);
  streamEl.appendChild(row);
  streamEl.appendChild(m);
  afterAppend(forceScroll);
}
function addSys(text) {
  var el = document.createElement('div');
  el.className = 'sys';
  el.textContent = text;
  streamEl.appendChild(el);
  afterAppend();
}
var toolLines = {}; // callId → 元素
function addToolLine(callId, name, args) {
  var el = document.createElement('div');
  el.className = 'tool';
  var n = document.createElement('span');
  n.className = 'tname';
  n.textContent = '🔧 ' + (name || '工具');
  var a = document.createElement('span');
  a.className = 'targs';
  var argText = '';
  try { argText = typeof args === 'string' ? args : JSON.stringify(args); } catch (e) { argText = ''; }
  a.textContent = argText;
  a.title = argText;
  el.appendChild(n);
  el.appendChild(a);
  streamEl.appendChild(el);
  if (callId) toolLines[callId] = el;
  afterAppend();
}
function markToolResult(callId, ok) {
  var el = callId ? toolLines[callId] : null;
  if (el) {
    el.classList.toggle('err', !ok);
    var n = el.querySelector('.tname');
    n.textContent = n.textContent.replace('🔧', ok ? '✅' : '❌');
  }
}
function showThinking() {
  var el = document.getElementById('thinkingHint');
  if (el) return;
  el = document.createElement('div');
  el.id = 'thinkingHint';
  el.className = 'thinking';
  el.textContent = '🤔 思考中…';
  streamEl.appendChild(el);
  afterAppend();
}
function finishStreaming(turn, step, finalText) {
  var key = (turn === undefined ? '?' : turn) + ':' + (step === undefined ? '?' : step);
  var b = streamingBubbles[key];
  var think = document.getElementById('thinkingHint');
  if (think) think.remove();
  if (b) {
    if (finalText) b.bubble.textContent = finalText; // 以最终消息为准
    delete streamingBubbles[key];
  } else if (finalText) {
    addBubble('ai', finalText, '🤖 · ' + fmtTime());
  }
  afterAppend();
}

// ── 审批条 ───────────────────────────────────────────────────────────────
function pushApproval(d) {
  for (var i = 0; i < state.approvals.length; i++) {
    if (state.approvals[i].id === d.id) return; // 重连补推去重
  }
  state.approvals.push(d);
  renderApproval();
}
function renderApproval() {
  var bar = $('approvalBar');
  if (state.approvals.length === 0) {
    bar.classList.remove('show');
    clearInterval(state.apTimer);
    return;
  }
  var d = state.approvals[0];
  bar.classList.add('show');
  $('apTool').textContent = d.toolName || '未知工具';
  $('apReason').textContent = d.reason || '（无摘要）';
  $('apQueue').textContent = state.approvals.length > 1 ? ('（' + state.approvals.length + ' 个待处理）') : '';
  $('apAllow').disabled = false;
  $('apReject').disabled = false;
  // 倒计时：优先用服务器给的 startedAt 校准，避免重载后重新计满。
  var startedAt = d.startedAt ? d.startedAt : Date.now();
  state.apLeft = Math.max(1, Math.ceil((startedAt + (d.waitSec || state.waitSec) * 1000 - Date.now()) / 1000));
  updateApTimer();
  clearInterval(state.apTimer);
  state.apTimer = setInterval(updateApTimer, 1000);
}
function updateApTimer() {
  if (state.approvals.length === 0) return;
  $('apTimer').textContent = state.apLeft > 0 ? (state.apLeft + 's 后转回电脑端') : '转回电脑端…';
  if (state.apLeft <= 0) clearInterval(state.apTimer);
  state.apLeft -= 1;
}
function settleApprovalLocal(id) {
  state.approvals = state.approvals.filter(function (a) { return a.id !== id; });
  renderApproval();
}
function answerApproval(decision) {
  var d = state.approvals[0];
  if (!d) return;
  $('apAllow').disabled = true;
  $('apReject').disabled = true;
  postJSON('/mobile-remote/approve', { token: token, id: d.id, decision: decision })
    .then(function (r) {
      if (r && r.ok) toast(decision === 'allow' ? '已允许 ✓' : '已拒绝 ⛔');
      else toast('操作失败：' + ((r && r.message) || '未知错误'));
      settleApprovalLocal(d.id); // 结果确认帧到达前先乐观收起
    })
    .catch(function () { toast('网络错误，请重试'); renderApproval(); });
}
$('apAllow').addEventListener('click', function () { answerApproval('allow'); });
$('apReject').addEventListener('click', function () { answerApproval('reject'); });

// ── 发送消息 ─────────────────────────────────────────────────────────────
var inputEl = $('input');
var sendBtn = $('sendBtn');
inputEl.addEventListener('input', function () {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);
function send() {
  var text = inputEl.value.trim();
  if (!text) return;
  if (Date.now() < state.sendLockUntil) { toast('发送太快，请稍候'); return; }
  sendBtn.disabled = true;
  postJSON('/mobile-remote/send', { token: token, text: text })
    .then(function (r) {
      if (r && r.ok) {
        inputEl.value = '';
        inputEl.style.height = 'auto';
        // 消息本体经 session/event 流回来渲染，这里不重复插气泡
      } else {
        toast('发送失败：' + ((r && r.message) || '未知错误'));
      }
      state.sendLockUntil = Date.now() + state.throttleSec * 1000;
      refreshSendBtn();
    })
    .catch(function () { toast('网络错误'); sendBtn.disabled = false; });
}
function refreshSendBtn() {
  var left = state.sendLockUntil - Date.now();
  if (left > 0) {
    sendBtn.disabled = true;
    setTimeout(refreshSendBtn, 200);
  } else {
    sendBtn.disabled = false;
  }
}
function postJSON(path, body) {
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(function (r) { return r.json(); });
}

// ── 连接管理 ─────────────────────────────────────────────────────────────
function setConn(cls, text) {
  $('connDot').className = cls;
  $('connText').textContent = text;
}
function setAgent(status) {
  state.agentStatus = status || null;
  var chip = $('agentChip');
  chip.textContent = status === 'running' ? '运行中' : (status ? '空闲' : '无会话');
  chip.className = 'chip' + (status === 'running' ? ' run' : '');
}
function setSession(sid, cwd) {
  state.sessionId = sid || null;
  var short = sid ? String(sid).replace(/^session-/, '').slice(0, 8) : null;
  $('connText').textContent = (short ? '会话 ' + short : '等待电脑端会话…') + (cwd ? ' · ' + cwd : '');
}

function connect() {
  if (state.es) { try { state.es.close(); } catch (e) {} }
  setConn('', '连接中…');
  var url = '/mobile-remote/sse?token=' + encodeURIComponent(token) + '&since=' + state.seq;
  var es = new EventSource(url);
  state.es = es;
  es.addEventListener('open', function () {
    state.backoff = 1000;
    setConn('ok', '已连接');
    $('stoppedBanner').classList.remove('show');
    $('replacedBanner').classList.remove('show');
  });
  es.addEventListener('hello', function (e) {
    var d = JSON.parse(e.data);
    state.throttleSec = d.throttleSec || 2;
    state.waitSec = d.waitSec || 120;
    // 服务器重启（epoch 变化）→ 全局事件号已归零，旧游标作废。
    if (state.epoch && d.epoch && state.epoch !== d.epoch) state.seq = 0;
    state.epoch = d.epoch || state.epoch;
    if (typeof d.seq === 'number' && d.seq > state.seq) state.seq = d.seq;
    saveCursor();
    setSession(d.sessionId, d.cwd);
    setAgent(d.status);
  });
  es.addEventListener('bound', function (e) {
    var d = JSON.parse(e.data);
    setSession(d.sessionId, d.cwd);
    addSys('已绑定电脑当前会话');
  });
  es.addEventListener('session', function (e) {
    var d = JSON.parse(e.data);
    var idNum = parseInt(e.lastEventId, 10);
    if (Number.isFinite(idNum) && idNum > state.seq) { state.seq = idNum; saveCursor(); }
    handleSession(d);
  });
  es.addEventListener('status', function (e) {
    var d = JSON.parse(e.data);
    setAgent(d.status);
  });
  es.addEventListener('approval', function (e) {
    pushApproval(JSON.parse(e.data));
  });
  es.addEventListener('approval_result', function (e) {
    var d = JSON.parse(e.data);
    settleApprovalLocal(d.id);
    if (d.via === 'timeout') { addSys('⏱ 审批超时，已转回电脑端'); toast('审批超时，转回电脑端'); }
    if (d.via === 'stop' || d.via === 'disconnect') addSys('⛔ 审批已中断（' + d.via + '）');
  });
  es.addEventListener('replaced', function () {
    state.noAuto = true;
    es.close();
    setConn('bad', '连接被其他设备顶替');
    $('replacedBanner').classList.add('show');
  });
  es.addEventListener('stopped', function () {
    state.noAuto = true;
    es.close();
    setConn('bad', '远程已停止');
    $('stoppedBanner').classList.add('show');
  });
  es.addEventListener('error', function () {
    setConn('bad', '连接断开，' + Math.round(state.backoff / 1000) + 's 后重连');
    es.close();
    if (state.noAuto) return;
    var wait = state.backoff;
    state.backoff = Math.min(state.backoff * 2, 10000);
    setTimeout(connect, wait);
  });
}
$('newMsg').addEventListener('click', function () {
  streamEl.scrollTop = streamEl.scrollHeight;
  $('newMsg').classList.remove('show');
});
streamEl.addEventListener('scroll', function () {
  state.nearBottom = nearBottom();
  if (state.nearBottom) $('newMsg').classList.remove('show');
});
$('rebindBtn').addEventListener('click', function () { location.reload(); });
$('resumeBtn').addEventListener('click', function () {
  state.noAuto = false;
  $('stoppedBanner').classList.remove('show');
  connect();
});
$('takeoverBtn').addEventListener('click', function () {
  state.noAuto = false;
  $('replacedBanner').classList.remove('show');
  connect();
});
// 回前台立即检查连接（部分浏览器不触发 EventSource 自动重连）。
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (state.noAuto) return;
  if (!state.es || state.es.readyState === 2) {
    state.backoff = 1000;
    connect();
  }
});

if (!token) {
  document.body.innerHTML = '<div id="hintBar">链接缺少配对码，请通过电脑端设置页的二维码打开。</div>';
} else {
  connect();
}
</script>
</body>
