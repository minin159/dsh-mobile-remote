<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>DSH 远程</title>
<style>
  /* 风格 E · iOS 黑灰（opt6 皮肤化，对齐 App 壳 v5 提案第五列）：暗色为主，亮色简单适配。
     安全区适配 iPhone 底部横条；毛玻璃 = 半透明 + backdrop blur。 */
  :root {
    --bg: #f2f2f7; --panel: #ffffff; --panel2: rgba(120,120,128,.12); --press: rgba(120,120,128,.22);
    --ink: #1c1c1e; --ink-ai: #1c1c1e; --muted: #6e6e73;
    --line: #e6e6eb; --line2: #d9d9de;
    --accent: #ffffff; --accent-ink: #0b0b0c;   /* 主强调 = 白底黑字（运行中胶囊/发送键/主按钮） */
    --ok: #30d158; --bad: #ff453a;
    --bubble-user: #2c2c2e; --bubble-user-ink: #f2f2f7;
    --bar-bg: rgba(242,242,247,.86);
    --frost: rgba(255,255,255,.85); --frost-line: rgba(0,0,0,.1);
    --shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050506; --panel: #141416; --panel2: #1f1f23; --press: #26262a;
      --ink: #f2f2f7; --ink-ai: #ececf0; --muted: #98989e;
      --line: #222226; --line2: #26262a;
      --bar-bg: rgba(12,12,14,.88);
      --frost: rgba(30,30,32,.78); --frost-line: rgba(255,255,255,.12);
      --shadow: 0 6px 20px rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 高度基准（C1 fix(scroll)）：dvh 优先——Android WebView 沉浸式全屏下
     html/body 的 height:100% 以整块物理屏为包含块（浏览器 App 会自行扣除
     系统栏，WebView 不会），#stream 的 flex:1 拿到超视口高度 → 底部被导航栏
     遮住、overflow-y 不触发；dvh 跟随动态视口。老内核无 dvh 时回退 100%。 */
  html, body { height: 100%; }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  button, input, textarea { font-family: inherit; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; /* C3：正文基准 15→14px（对齐 ZCode 移动端） */
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* 滚动只发生在 #stream/#homeView（唯一滚动容器），
                          双滚动链是 WebView 下「能滚但显示不全」的另一半根源 */
  }
  /* dvh 不可用时的兜底布局（脚本探测后加 class）：body 四边钉住视口，
     掐断 WebView 高度测量抖动；现代浏览器不受影响（class 永不加）。 */
  body.fixedBody {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  }
  /* ── 视图切换（阶段 4）：首页 ↔ 会话双视图，body class 控制 ─────────── */
  #topbar, #homeTop {
    display: none; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom: 1px solid var(--line); background: var(--bar-bg);
    flex-shrink: 0; z-index: 20;
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  body.view-chat #topbar { display: flex; }
  body.view-home #homeTop { display: flex; }
  .connDot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .connDot.ok { background: var(--ok); } .connDot.bad { background: var(--bad); }
  #connText { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 状态胶囊：运行中=白底黑字（主强调），完成/空闲=中性灰，错误=红 */
  .chip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 0;
    background: var(--panel2); color: var(--muted); flex-shrink: 0; }
  .chip.run { background: var(--accent); color: var(--accent-ink); }
  .chip.bad { background: rgba(255,69,58,.16); color: var(--bad); }
  /* 会话视图顶栏：← 返回 + 当前会话标题 + 连接/状态 */
  #backBtn { border: 0; background: transparent; color: var(--ink); font-size: 14px;
    padding: 4px 8px 4px 0; flex-shrink: 0; }
  #chatTitle { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ── 首页（阶段 4）：汇总行 + 说明卡 + 工作区卡片 ──────────────────── */
  #homeView { display: none; flex: 1; min-height: 0; flex-direction: column;
    overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body.view-home #homeView { display: flex; }
  /* 首页页首：iOS 大标题（24px 粗体，C3 由 26px 等比收紧）+ 副标题 */
  #sumRow { display: flex; align-items: center; gap: 10px; padding: 14px 16px 5px; }
  #sumText { flex: 1; min-width: 0; }
  #sumConn { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: .2px; }
  #sumCount { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  #refreshBtn { border: 0; background: var(--panel2); color: var(--ink);
    border-radius: 999px; font-size: 12.5px; font-weight: 600; padding: 6px 14px; flex-shrink: 0; }
  #refreshBtn:active { background: var(--press); }
  #refreshBtn:disabled { opacity: .4; }
  #newBtn { border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 999px; font-size: 12.5px; font-weight: 600; padding: 6px 14px; flex-shrink: 0; }
  #newBtn:disabled { opacity: .4; }
  /* 首页视图分段切换（优3）：按工作区 / 按时间线 */
  /* 首页视图分段切换（优3）：iOS segmented 形态 */
  #segRow { display: flex; gap: 0; margin: 8px 16px 5px; padding: 2px;
    background: var(--panel2); border-radius: 9px; }
  .segBtn { flex: 1; border: 0; background: transparent; color: var(--muted);
    border-radius: 7px; font-size: 12.5px; font-weight: 500; padding: 5px 0; }
  .segBtn.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #introCard { display: flex; gap: 8px; align-items: flex-start; margin: 5px 16px 7px;
    padding: 11px 13px; background: var(--panel); border: 0;
    border-radius: 12px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  #introText { flex: 1; }
  #introClose { border: 0; background: var(--panel2); color: var(--muted); width: 22px; height: 22px;
    border-radius: 50%; font-size: 11px; line-height: 1; padding: 0; flex-shrink: 0; }
  #followRow { display: none; margin: 0 16px 7px; padding: 10px 13px;
    border: 0; border-radius: 12px; background: var(--panel2);
    color: var(--ink); font-size: 13px; font-weight: 500; text-align: left; }
  #followRow:active { background: var(--press); }
  /* 工作区卡片 = iOS inset grouped：无描边卡片、行内细分割线、chevron 折叠 */
  #homeList { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .wsCard { background: var(--panel); border: 0; border-radius: 12px;
    margin: 7px 16px; overflow: hidden; }
  .wsHead { display: flex; align-items: center; gap: 10px; padding: 10px 13px; cursor: pointer; }
  .wsHead:active { background: var(--press); }
  .wsMain { flex: 1; min-width: 0; }
  .wsName { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsPath { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin-top: 2px; }
  .wsSide { flex-shrink: 0; text-align: right; }
  .wsCount { font-size: 11.5px; color: var(--muted); }
  .wsUpd { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .wsChevron { flex-shrink: 0; color: var(--muted); font-size: 12.5px; }
  .wsBody { border-top: 1px solid var(--line); }
  .wsCard.folded .wsBody { display: none; }
  /* 任务行：标题 + 相对时间 + 四态胶囊，点击进入会话视图 */
  .taskRow { display: flex; align-items: center; gap: 8px; padding: 9px 13px;
    border-top: 1px solid var(--line); cursor: pointer; }
  .taskRow:first-child { border-top: 0; }
  .taskRow:active { background: var(--press); }
  .taskRow.bound { background: var(--panel2); box-shadow: inset 2px 0 0 var(--ink); }
  .taskMain { flex: 1; min-width: 0; }
  .taskTitle { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskSub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .tchip { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 0;
    background: var(--press); color: var(--muted); flex-shrink: 0; }
  .tchip.run { background: var(--accent); color: var(--accent-ink); }
  .tchip.err { background: rgba(255,69,58,.14); color: var(--bad); }
  /* ── 横幅（停止/顶替/配对失效）────────────────────────────────────── */
  .banner {
    display: none; padding: 10px 13px; font-size: 12.5px; line-height: 1.5;
    background: var(--panel2); color: var(--ink); flex-shrink: 0;
  }
  .banner.show { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .banner button { border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 10px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; flex-shrink: 0; }
  /* ── 审批条（两视图共用：挂起审批不属于任何会话视图）───────────────── */
  #approvalBar {
    display: none; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 11px 15px; z-index: 15; flex-shrink: 0;
  }
  #approvalBar.show { display: block; }
  #apHead { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
  #apTimer { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--bad); font-variant-numeric: tabular-nums; }
  #apReason { margin: 5px 0 9px; font-size: 12px; color: var(--muted);
    max-height: 5.2em; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  #apQueue { font-size: 10.5px; color: var(--muted); }
  /* 审批按钮：48px 高 / 12px 圆角；允许=白底黑字（主按钮），拒绝=错误红 */
  .apBtns { display: flex; gap: 10px; }
  .apBtns button { flex: 1; border: 0; border-radius: 12px; height: 48px; font-size: 15px; font-weight: 600; }
  #apAllow { background: var(--accent); color: var(--accent-ink); }
  #apReject { background: var(--bad); color: #fff; }
  .apBtns button:disabled { opacity: .45; }
  /* ── 会话视图：消息流 ───────────────────────────────────────────────── */
  #chatView { display: none; flex: 1; min-height: 0; flex-direction: column; }
  body.view-chat #chatView { display: flex; }
  #stream { flex: 1; overflow-y: auto; padding: 12px 12px 8px; -webkit-overflow-scrolling: touch; }
  .row { display: flex; margin: 7px 0; }
  .row.me { justify-content: flex-end; }
  /* AI 消息 = 无边框纯文本；用户消息 = #2C2C2E 深灰气泡右对齐 */
  .bubble {
    max-width: 100%; border-radius: 17px; padding: 2px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
    background: transparent; border: 0; color: var(--ink-ai);
  }
  .row.me .bubble { max-width: 86%; background: var(--bubble-user); color: var(--bubble-user-ink);
    padding: 8px 12px; }
  .meta { font-size: 10px; color: var(--muted); margin: 2px 6px; }
  .row.me .meta { text-align: right; }
  .sys { text-align: center; font-size: 10.5px; color: var(--muted); margin: 9px 0; }
  .tool { font-size: 11.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line2);
    border-radius: 12px; padding: 7px 11px; margin: 5px 0; display: flex; gap: 6px; align-items: baseline;
    cursor: pointer; }
  .tool .tname { color: var(--ink); font-weight: 600; flex-shrink: 0; }
  .tool .targs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tool.open .targs { white-space: pre-wrap; word-break: break-all; }
  .tool.err .tname { color: var(--bad); }
  /* 代码块（阶段 2）：围栏渲染，横向滚动，暗色变量随系统 */
  .bubble pre.code { background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px;
    padding: 9px 11px; margin: 7px 0 2px; overflow-x: auto; white-space: normal;
    font: 11.5px/1.55 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  .bubble pre.code .codeLang { font-size: 9.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 4px; }
  .bubble pre.code code { white-space: pre; font: inherit; }
  /* 行内代码 chip（阶段 4）：受控 DOM 构建，与代码块同防注入标准 */
  .codeChip { font: 11.5px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--panel2); border: 0; border-radius: 5px;
    padding: 1px 5px; margin: 0 1px; word-break: break-all; white-space: pre-wrap; }
  /* markdown 表格（阶段 4）：窄屏横向滚动，单元格受控构建 */
  .tblWrap { overflow-x: auto; margin: 7px 0 2px; border: 1px solid var(--line2);
    border-radius: 12px; -webkit-overflow-scrolling: touch; }
  .bubble table { border-collapse: collapse; font-size: 12px; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--line2); padding: 5px 9px; text-align: left;
    vertical-align: top; word-break: break-word; }
  .bubble th { background: var(--panel2); font-weight: 600; }
  ::selection { background: rgba(148,148,158,.4); }
  #stream::-webkit-scrollbar { width: 4px; }
  #stream::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }
  .thinking { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 4px 6px; }
  /* 思考过程可折叠块（C1 feat(thinking)）：流式期间实时累积，定稿后收起态留摘要行。
     沿用 E 令牌（panel2 卡片底 + line2 描边 + muted 次级文字），不引入新色。 */
  .thinkBlock {
    margin: 6px 0; border: 1px solid var(--line2); border-radius: 12px;
    background: var(--panel2); overflow: hidden;
  }
  .thinkHead {
    display: flex; align-items: baseline; gap: 6px;
    padding: 7px 11px; cursor: pointer;
    font-size: 11.5px; color: var(--muted); font-style: italic;
  }
  .thinkHead .thinkCaret { flex-shrink: 0; font-style: normal; }
  .thinkHead .thinkSum {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thinkBlock.open .thinkHead .thinkSum { white-space: pre-wrap; overflow: visible; }
  .thinkBody {
    display: none; padding: 0 11px 8px;
    font-size: 12px; line-height: 1.6; color: var(--muted); font-style: normal;
    white-space: pre-wrap; word-break: break-word;
  }
  .thinkBlock.open .thinkBody { display: block; }
  /* 回到底部 ↓ FAB（阶段 4：离开底部/新消息时出现，圆形） */
  #newMsg {
    position: fixed; right: 14px; bottom: calc(96px + env(safe-area-inset-bottom));
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--frost); color: var(--ink); border: 1px solid var(--frost-line); font-size: 19px;
    align-items: center; justify-content: center;
    display: none; z-index: 18; box-shadow: var(--shadow);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  body.view-chat #newMsg.show { display: flex; }
  /* 流式"当前动作"pill（阶段 4）：最新 tool/call 摘要，仅会话视图显示（毛玻璃） */
  #actionPill {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(98px + env(safe-area-inset-bottom));
    display: none; max-width: 58vw;
    background: var(--frost); color: var(--ink); border: 1px solid var(--frost-line); font-size: 11.5px;
    border-radius: 999px; padding: 7px 14px; z-index: 17;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  body.view-chat #actionPill.show { display: block; }
  /* ── 底部输入区（阶段 5：盾牌 + 上下文只读 + ↑发送；模型/思考键按探针结论隐藏）── */
  #composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bar-bg); flex-shrink: 0;
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  #input {
    flex: 1; resize: none; border: 0; border-radius: 18px;
    background: var(--panel2); color: var(--ink); font: inherit; padding: 11px 14px;
    max-height: 120px; line-height: 1.4;
  }
  #input:focus { outline: none; }
  /* 底栏扩展键位（盾牌/上下文）：与输入框同高的方形小按钮；盾牌/模型用 SF 风格细线条图标 */
  .barBtn {
    border: 0; border-radius: 12px; background: var(--panel2);
    color: var(--ink); font-size: 16px; line-height: 1; padding: 0; flex-shrink: 0;
    height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center;
  }
  .barBtn:active { background: var(--press); }
  #ctxBtn { font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 52px; padding: 0 8px; }
  /* 盾牌/模型键图标：CSS mask 内联 SVG 细线条（不支持 mask 时回退原 emoji 字形） */
  @supports ((-webkit-mask-image: url("x")) or (mask-image: url("x"))) {
    #shieldBtn, #modelBtn { font-size: 0; }
    #shieldBtn::before, #modelBtn::before {
      content: ""; display: block; width: 22px; height: 22px; background: currentColor;
      -webkit-mask-position: center; mask-position: center;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-size: contain; mask-size: contain;
    }
    #shieldBtn::before {
      -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 19 5.8v5.3c0 4.4-2.9 8.3-7 9.9-4.1-1.6-7-5.5-7-9.9V5.8z'/></svg>");
      mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 19 5.8v5.3c0 4.4-2.9 8.3-7 9.9-4.1-1.6-7-5.5-7-9.9V5.8z'/></svg>");
    }
    #modelBtn::before {
      -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 20 7.4v9.2L12 21 4 16.6V7.4z'/><path d='M4 7.4 12 12l8-4.6M12 12v9'/></svg>");
      mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 20 7.4v9.2L12 21 4 16.6V7.4z'/><path d='M4 7.4 12 12l8-4.6M12 12v9'/></svg>");
    }
  }
  /* 盾牌档位着色：放行=红（危险），拒绝=灰（静默） */
  #shieldBtn.allow { color: var(--bad); background: rgba(255,69,58,.16); }
  #shieldBtn.deny { color: var(--muted); background: var(--press); }
  #sendBtn {
    border: 0; border-radius: 22px; background: var(--accent); color: var(--accent-ink);
    font-size: 19px; font-weight: 600; padding: 0; flex-shrink: 0;
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  }
  #sendBtn:disabled { opacity: .4; }
  /* 盾牌「全部放行」红色警示条：会话视图内、输入栏上方，常驻 */
  #shieldBanner {
    display: none; flex-shrink: 0;
    background: rgba(255,69,58,.14); color: var(--bad);
    font-size: 12.5px; font-weight: 600; text-align: center;
    padding: 8px 12px; border-top: 1px solid rgba(255,69,58,.3);

<script>
'use strict';
// ── WebView 滚动加固（C1 fix(scroll)）────────────────────────────────────
// Android WebView（壳）与浏览器的高度测量差异：CSS 侧已把 html/body 基准
// 换成 100dvh（老内核回退 100%）。这里再探一次 dvh 实际是否生效——
// 无 dvh 支持（老 WebView 内核）时 body 直接切 position:fixed 布局
// （四边钉住视口），从包含块层面掐断「body 高于视口」的整条失效链。
(function () {
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;height:100dvh;visibility:hidden;';
    document.body.appendChild(probe);
    var ok = probe.getBoundingClientRect().height > 0
      && Math.abs(probe.getBoundingClientRect().height - window.innerHeight) < 2;
    probe.remove();
    if (!ok) document.body.classList.add('fixedBody');
  } catch (e) {}
})();
// ── 基础状态 ─────────────────────────────────────────────────────────────
// token 即配对码：来自页面路径段（/mobile-remote/p/<token>），所有接口调用都带上。
var token = (location.pathname.split('/p/')[1] || '').replace(/\/+$/, '');
var $ = function (id) { return document.getElementById(id); };
var streamEl = $('stream');
var homeEl = $('homeView');
var homeListEl = $('homeList');
var state = {
  seq: 0,            // 已消费到的全局事件号（SSE id），断点补发游标
  epoch: null,       // 服务器启动纪元：变化说明服务器重启过，游标作废
  es: null,          // EventSource
  backoff: 1000,     // 重连退避 1s→10s 封顶
  noAuto: false,     // 被顶替/被停止后停止自动重连
  throttleSec: 2,
  waitSec: 120,
  sessionId: null,
  sessionCwd: '',
  agentStatus: null,
  approvals: [],     // 待处理审批队列
  apTimer: null, apLeft: 0,
  nearBottom: true,
  sendLockUntil: 0,
  lastPingAt: 0,     // 最近一次服务器心跳（具名 ping 事件）；看门狗据此判定半开连接
  // ── 阶段 4：双视图 + 首页数据 ──
  view: 'home',
  homeScroll: 0,             // 首页滚动位置（往返保持）
  chatScrollBySid: {},       // 会话视图滚动位置（按会话 id，往返保持）
  sessionsById: {},          // sid → 会话条目（/sessions 数据缓存）
  homeDirty: true,           // 首页列表需要重建
  rowChips: {},              // sid → 任务行状态胶囊（SSE 状态帧增量更新）
  rowRows: {},               // sid → 任务行元素（绑定高亮增量更新）
  pinned: null,              // 手机端钉住的会话（非空时首页显示"跟随电脑"入口）
  foldMap: {},               // 折叠的工作区 cwd → true（localStorage 持久化）
  homeMode: 'ws',            // 首页视图（优3）：'ws'=按工作区 / 'time'=按时间线
  lastHomeFetch: 0,          // 首页数据节流（3s）
  lastAction: null,          // 最新 tool/call 摘要（当前动作 pill）
  // ── 阶段 5：底栏运行时控件 ──
  shield: 'ask',             // 盾牌档位：ask | allow-all | deny-all（服务器为事实源，hello/shield 帧同步）
  ctx: null,                 // 最近一轮用量 {pressure, rate, out}（◐ 只读展示，来自 assistant/message.usage）
};
// 游标持久化：安卓息屏回前台走整页重载（P5 实测），靠 sessionStorage 带回断点与视图。
try {
  state.seq = parseInt(sessionStorage.getItem('mr-seq') || '0', 10) || 0;
  state.epoch = sessionStorage.getItem('mr-epoch');
} catch (e) {}

function saveCursor() {
  try {
    sessionStorage.setItem('mr-seq', String(state.seq));
    sessionStorage.setItem('mr-epoch', state.epoch || '');
  } catch (e) {}
}

// ── 小工具 ───────────────────────────────────────────────────────────────
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.style.display = 'none'; }, 2600);
}
function fmtTimeOf(d) {
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
/** 相对时间（阶段 4 首页/任务行用）：刚刚/N 分钟前/N 小时前/N 天前/月日。 */
function fmtRel(ts) {
  ts = Number(ts) || 0;
  if (!ts) return '';
  var diff = Date.now() - ts;
  if (diff < 0) diff = 0;
  if (diff < 60 * 1000) return '刚刚';
  if (diff < 3600 * 1000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400 * 1000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 7 * 86400 * 1000) return Math.floor(diff / 86400000) + ' 天前';
  var d = new Date(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
/** cwd 末段（工作区名）；空 cwd = 「未分组」（spec 止损：缺目录信息不阻塞分组）。 */
function cwdBasename(cwd) {
  var s = String(cwd || '');
  if (!s) return '未分组';
  var parts = s.split(/[\\/]/).filter(Boolean);
  return parts.pop() || s;
}
function shortSid(sid) { return sid ? String(sid).replace(/^session-/, '').slice(0, 8) : ''; }
/** 会话显示标题：标题快照 > 工作区名 · 短 id > 会话 短 id。 */
function sessionTitle(it) {
  if (it && it.title) return it.title;
  var base = cwdBasename(it && it.cwd);
  if (base !== '未分组') return base + ' · ' + shortSid(it && it.id);
  return '会话 ' + shortSid(it && it.id);
}
function sysLine(text) {
  var el = document.createElement('div');
  el.className = 'sys';
  el.textContent = text;
  return el;
}
/** 四态状态文案（运行中/空闲/完成/错误/已结束；done 为启发式映射）。 */
function statusLabel(st) {
  if (st === 'running') return '运行中';
  if (st === 'done') return '完成';
  if (st === 'error') return '错误';
  if (st === 'ended') return '已结束';
  return '空闲';
}
function statusChipCls(st) {
  if (st === 'running') return 'run';
  if (st === 'error') return 'err';
  if (st === 'done') return 'done';
  return '';
}
function nearBottom() {
  return streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 60;
}
function afterAppend(force) {
  trimStream();
  if (force || state.nearBottom) {
    streamEl.scrollTop = streamEl.scrollHeight;
    $('newMsg').classList.remove('show');
  } else {
    $('newMsg').classList.add('show');
  }
}
// 消息流节点上限：超出从最旧一侧折叠（spec 的截断方案；虚拟滚动在本体量下性价比不足）。
var STREAM_MAX = 350;
function trimStream() {
  var excess = streamEl.childElementCount - STREAM_MAX;
  if (excess <= 0) return;
  for (var i = 0; i < excess; i++) {
    var node = streamEl.firstElementChild;
    if (!node) break;
    var cid = node.getAttribute('data-call');
    if (cid) delete toolLines[cid]; // 同步清理工具行索引，防悬挂引用
    // 思考块同理：被折叠移除的块从索引清掉（thinkBlockOf 的 parentNode 检查兜底重建）
    for (var k in thinkBlocks) {
      if (thinkBlocks[k].el === node) delete thinkBlocks[k];
    }
    node.remove();
  }
  if (!streamEl.firstElementChild || streamEl.firstElementChild.id !== 'trimMark') {
    var mark = document.createElement('div');
    mark.id = 'trimMark';
    mark.className = 'sys';
    mark.textContent = '…较早内容已折叠…';
    streamEl.insertBefore(mark, streamEl.firstChild);
  }
}
/** 用户/助手消息的文本提取：content 块数组里取 text 块（其余类型由专属事件渲染）。 */
function contentText(content) {
  if (typeof content === 'string') return content;
  var out = '';
  if (Array.isArray(content)) {
    for (var i = 0; i < content.length; i++) {
      var b = content[i] || {};
      if ((b.kind || b.type) === 'text' && typeof b.text === 'string') {
        out += (out ? '\n' : '') + b.text;
      }
    }
  }
  return out;
}
/** 思考文本提取（C1）：assistant/message 定稿 content 里的 reasoning 块。 */
function reasoningTextOf(content) {
  if (!Array.isArray(content)) return '';
  for (var i = 0; i < content.length; i++) {
    var b = content[i] || {};
    if ((b.kind || b.type) === 'reasoning' && typeof b.text === 'string') return b.text;
  }
  return '';
}
/** 生成一条助手流式气泡（按 turn:step 归并 text-delta）。 */
var streamingBubbles = {};
function streamBubble(turn, step) {
  var key = turn + ':' + step;
  var b = streamingBubbles[key];
  if (!b || !b.el.parentNode) {
    var el = document.createElement('div');
    el.className = 'row';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    el.appendChild(bubble);
    streamEl.appendChild(el);
    b = { el: el, bubble: bubble, text: '' };
    streamingBubbles[key] = b;
  }
  return b;
}

// ── 会话事件渲染 ─────────────────────────────────────────────────────────
function handleSession(ev) {
  var type = ev.type || '';
  var data = ev.data || {};
  if (ev.clipped) {
    // 超长帧被服务器瘦身：文本已由 assistant/chunk 增量送达，最终消息只做收尾。
    if (type === 'assistant/message') { finishStreaming(data.turn, data.step, null); }
    return;
  }
  switch (type) {
    case 'user/message': {
      var src = data.source || {};
      var who = src.kind === 'plugin' ? '📱 ' + (src.plugin || '插件') : '💻 电脑';
      var text = contentText(data.content || (data.message && data.message.content));
      addBubble('me', text, who + ' · ' + fmtTimeOf(new Date()), true);
      break;
    }
    case 'assistant/chunk': {
      var chunk = data.chunk || {};
      if (chunk.type === 'text-delta' && typeof chunk.text === 'string' && chunk.text) {
        var b = streamBubble(data.turn, data.step);
        b.text += chunk.text;
        b.bubble.textContent = b.text;
        afterAppend();
      } else if (chunk.type === 'reasoning-delta' && typeof chunk.text === 'string') {
        if (chunk.text) appendThinking(data.turn, data.step, chunk.text);
        else showThinking();
      }
      break;
    }
    case 'assistant/message': {

// ── 思考过程可折叠块（C1 feat(thinking)）────────────────────────────────
// 流式 reasoning-delta 累积进当前 step 的可折叠块；assistant/message 定稿后
// 转为收起态（带行数/字数摘要）。reasoning 块与 chunk 均出自同一适配器
// （宿主 BlockAssembler/ pi-ai thinking_* 全链，载荷形状已核实）。
// 模型不输出思考时不出现任何块（showThinking 仍兜底老语义：只提示不渲染）。
var thinkFoldOpen = null; // 用户对思考块的展开偏好：null=默认收起（localStorage 持久化）

} catch (e) {}

}
function thinkSummaryOf(text) {
  var lines = text ? text.split('\n').length : 0;
  var chars = text ? text.length : 0;
  return lines + ' 行 · ' + chars + ' 字';
}
/** 组装/取得流式思考块 DOM（同一 step 复用；流式期间内容实时追加）。 */

function thinkBlockOf(turn, step) {
  var key = (turn === undefined ? '?' : turn) + ':' + (step === undefined ? '?' : step);
  var t = thinkBlocks[key];
  if (!t || !t.el.parentNode) {
    var el = document.createElement('div');
    el.className = 'thinkBlock';
    var head = document.createElement('div');
    head.className = 'thinkHead';
    var caret = document.createElement('span');
    caret.className = 'thinkCaret';

    head.appendChild(caret);
    head.appendChild(sum);
    var body = document.createElement('div');
    body.className = 'thinkBody';
    el.appendChild(head);
    el.appendChild(body);
    // 折叠态记忆：用户展开过（thinkFoldOpen===true）则新块默认展开；
    // 收起偏好（false）与无记忆（null=默认收起）都从收起开始。
    var open = thinkFoldOpen === true;

    });
    streamEl.appendChild(el);

    afterAppend();

}
function setThinkOpen(el, open) {

/** 流式思考增量：追加文本；展开态才自动滚底（收起态不打扰阅读位置）。 */
function appendThinking(turn, step, text) {
  var t = thinkBlockOf(turn, step);
  t.text += text;

/** 定稿：reasoning 字段（若定稿消息携带）覆盖流式累积；转收起态 + 摘要行。 */
function settleThinking(turn, step, reasoning) {
  var key = (turn === undefined ? '?' : turn) + ':' + (step === undefined ? '?' : step);
  var t = thinkBlocks[key];
  if (t) {
    if (typeof reasoning === 'string' && reasoning) t.text = reasoning;
    t.live = false;
    if (!t.text) { t.el.remove(); delete thinkBlocks[key]; return; }
    t.body.textContent = t.text;
    t.sum.textContent = '🤔 已思考 · ' + thinkSummaryOf(t.text);
    setThinkOpen(t.el, false); // 定稿默认收起（点击可再展开）
  } else if (typeof reasoning === 'string' && reasoning) {
    // 无流式过程（补发历史帧/模型一次性给出）：直接落一条定稿态思考块
    var blk = thinkBlockOf(turn, step);
    blk.text = reasoning;
    blk.live = false;
    blk.body.textContent = reasoning;
    blk.sum.textContent = '🤔 已思考 · ' + thinkSummaryOf(reasoning);

}

  thinkBlockOf(undefined, undefined);
}

// ── 富文本渲染（零依赖、全部受控 DOM 防注入）────────────────────────────
/** 行内渲染：`代码` chip + 纯文本节点，只用 textContent/createTextNode，不经 innerHTML。 */
function appendInline(parent, text) {
  var parts = String(text).split(/(`[^`\n]+`)/);
  for (var i = 0; i < parts.length; i++) {
    var seg = parts[i];
    if (!seg) continue;
    var m = /^`([^`\n]+)`$/.exec(seg);
    if (m) {
      var chip = document.createElement('code');
      chip.className = 'codeChip';
      chip.textContent = m[1]; // 成对反引号才成 chip；孤反引号保持纯文本
      parent.appendChild(chip);
    } else {
      parent.appendChild(document.createTextNode(seg));
    }
  }
}
/** 拆一行 markdown 表格行为单元格（trim 后去首尾竖线再切分）。 */
function splitTableRow(line) {
  var s = String(line).trim();
  if (!s) return null;
  if (s.charAt(0) === '|') s = s.slice(1);
  if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
  var cells = s.split('|');
  var out = [];
  for (var i = 0; i < cells.length; i++) out.push(cells[i].replace(/^\s+|\s+$/g, ''));
  return out;
}
/** 表格行判定：非空且含竖线。 */
function isTableLine(line) { return /\S/.test(line) && String(line).indexOf('|') >= 0; }
/** 表格分隔行判定（| --- | :-: | 形态）：所有单元格都是 :?-+:? 且至少含一个竖线。 */
function isTableSep(line) {
  var s = String(line).trim();
  if (s.indexOf('|') < 0) return false; // 单独的 --- 是水平线，不当表格
  var cells = splitTableRow(s);
  if (!cells || cells.length === 0) return false;
  for (var i = 0; i < cells.length; i++) {
    if (!/^:?-+:?$/.test(cells[i].replace(/\s/g, ''))) return false;
  }
  return true;
}
/** 受控构建表格：thead 表头 + tbody 数据行，单元格走 appendInline（支持行内代码）。 */
function buildTable(headerCells, bodyRows) {
  var wrap = document.createElement('div');
  wrap.className = 'tblWrap';
  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var trh = document.createElement('tr');
  for (var i = 0; i < headerCells.length; i++) {
    var th = document.createElement('th');
    appendInline(th, headerCells[i]);
    trh.appendChild(th);
  }
  thead.appendChild(trh);
  table.appendChild(thead);
  if (bodyRows.length > 0) {
    var tbody = document.createElement('tbody');
    for (var r = 0; r < bodyRows.length; r++) {
      var tr = document.createElement('tr');
      for (var c = 0; c < bodyRows[r].length; c++) {
        var td = document.createElement('td');
        appendInline(td, bodyRows[r][c]);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
  }
  wrap.appendChild(table);
  return wrap;
}
/** 非代码段渲染：逐行扫描，markdown 表格块转受控 table，其余行保留文本（含行内代码 chip）。 */
function renderSegments(bubble, text) {
  var lines = String(text).split('\n');
  var i = 0;
  var plain = [];
  function flushPlain() {
    if (plain.length === 0) return;
    var span = document.createElement('span');
    appendInline(span, plain.join('\n'));
    bubble.appendChild(span);
    plain = [];
  }
  while (i < lines.length) {
    // 表格判定：当前行含竖线且下一行是分隔行（markdown 表格语法）；列数与表头一致才继续收，
    // 防止把表格后含竖线的普通文本误吞。
    if (isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      var headerCells = splitTableRow(lines[i]);
      if (headerCells && headerCells.length > 0) {
        flushPlain();
        var bodyRows = [];
        var j = i + 2;
        while (j < lines.length && isTableLine(lines[j])) {
          var cells = splitTableRow(lines[j]);
          if (!cells || cells.length !== headerCells.length) break;
          bodyRows.push(cells);
          j++;
        }
        bubble.appendChild(buildTable(headerCells, bodyRows));
        i = j;
        continue;
      }
    }
    plain.push(lines[i]);
    i++;
  }
  flushPlain();
}
/** 富文本渲染（零依赖、全部 textContent 防注入）：按 ``` 围栏拆分，代码段进 pre，
 *  非代码段再解析表格与行内代码。流式期间仍保持纯文本渲染（性能），
 *  仅在收到最终 assistant/message 时重渲染一次。 */
function renderContent(bubble, text) {
  bubble.textContent = '';
  var parts = String(text).split('```');
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      var seg = parts[i];
      var lang = '';
      var nl = seg.indexOf('\n');
      if (nl >= 0) {
        var first = seg.slice(0, nl).trim();
        if (/^[A-Za-z0-9_+#.\/-]{1,20}$/.test(first)) { lang = first; seg = seg.slice(nl + 1); }
      }
      var pre = document.createElement('pre');
      pre.className = 'code';
      if (lang) {
        var lb = document.createElement('div');
        lb.className = 'codeLang';
        lb.textContent = lang;
        pre.appendChild(lb);
      }
      var code = document.createElement('code');
      code.textContent = seg.replace(/\n$/, '');
      pre.appendChild(code);
      bubble.appendChild(pre);
    } else if (parts[i]) {
      renderSegments(bubble, parts[i]);
    }
  }
}
function finishStreaming(turn, step, finalText) {
  var key = (turn === undefined ? '?' : turn) + ':' + (step === undefined ? '?' : step);

    var bubble = document.createElement('div');

    streamEl.appendChild(el);

    var m = document.createElement('div');
    m.className = 'meta';
    m.textContent = '🤖 · ' + fmtTimeOf(new Date());
    streamEl.appendChild(m);
  }
  afterAppend();
}

// ── 审批条（两视图共用）─────────────────────────────────────────────────
function pushApproval(d) {

    if (state.approvals[i].id === d.id) return; // 重连补推去重

function renderApproval() {
  var bar = $('approvalBar');

    bar.classList.remove('show');
    clearInterval(state.apTimer);
    return;
  }
  var d = state.approvals[0];
  bar.classList.add('show');
  $('apTool').textContent = d.toolName || '未知工具';
  $('apReason').textContent = d.reason || '（无摘要）';
  $('apQueue').textContent = state.approvals.length > 1 ? ('（' + state.approvals.length + ' 个待处理）') : '';
  $('apAllow').disabled = false;
  $('apReject').disabled = false;
  // 倒计时：优先用服务器给的 startedAt 校准，避免重载后重新计满。
  var startedAt = d.startedAt ? d.startedAt : Date.now();
  state.apLeft = Math.max(1, Math.ceil((startedAt + (d.waitSec || state.waitSec) * 1000 - Date.now()) / 1000));

  $('apTimer').textContent = state.apLeft > 0 ? (state.apLeft + 's 后转回电脑端') : '转回电脑端…';
  if (state.apLeft <= 0) clearInterval(state.apTimer);

}

  $('apAllow').disabled = true;
  $('apReject').disabled = true;
  postJSON('/mobile-remote/approve', { token: token, id: d.id, decision: decision })
    .then(function (r) {
      if (handleAuthCode(r && r.code)) { renderApproval(); return; } // 配对失效：审批条还原，保留待处理
      if (r && r.ok) toast(decision === 'allow' ? '已允许 ✓' : '已拒绝 ⛔');
      else toast('操作失败：' + ((r && r.message) || '未知错误'));
      settleApprovalLocal(d.id); // 结果确认帧到达前先乐观收起

$('apAllow').addEventListener('click', function () { answerApproval('allow'); });
$('apReject').addEventListener('click', function () { answerApproval('reject'); });

// ── 发送消息 ─────────────────────────────────────────────────────────────
var inputEl = $('input');
var sendBtn = $('sendBtn');
inputEl.addEventListener('input', function () {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);
// 发送失败文案分场景：指引下一步动作而非裸报错。
function sendErrText(r) {
  var code = r && r.code;
  if (code === 'agent-unavailable') return '会话已结束或未就绪，回首页选择其他会话';
  if (code === 'throttled') return '发送太快，请等 ' + Math.ceil((r && r.retryAfterMs || 1000) / 1000) + ' 秒';
  if (code === 'no-session') return '尚未绑定会话，回首页选择';

  sendBtn.disabled = true;
  postJSON('/mobile-remote/send', { token: token, text: text })
    .then(function (r) {
      if (handleAuthCode(r && r.code)) return;
      if (r && r.ok) {
        inputEl.value = '';
        inputEl.style.height = 'auto';
        // 消息本体经 session/event 流回来渲染，这里不重复插气泡
      } else {
        toast(sendErrText(r));
      }
      state.sendLockUntil = Date.now() + state.throttleSec * 1000;
      refreshSendBtn();
    })
    .catch(function () { toast('网络错误'); sendBtn.disabled = false; });
}
function refreshSendBtn() {
  var left = state.sendLockUntil - Date.now();
  if (left > 0) {

    setTimeout(refreshSendBtn, 200);
  } else {
    sendBtn.disabled = false;
  }
}
// ── 阶段 5：底栏运行时控件 ────────────────────────────────────────────────

$('optAsk').addEventListener('click', function () { pickShield('ask'); });
$('optAllowAll').addEventListener('click', function () { pickShield('allow-all'); });
$('optDenyAll').addEventListener('click', function () { pickShield('deny-all'); });
// ◐ 上下文/缓存只读展示（P7 证实数据在既有 SSE 流上，故只做最小只读态；
// 完整展开控件与投影查询留待后续按需再开）。口径与宿主 contextPressure 同源：
// 占用 ≈ input + cacheRead + cacheWrite；命中率 = cacheRead / 三者和。
function fmtTok(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}
function updateCtx(u) {
  var pressure = (u.inputTokens || 0) + (u.cacheReadTokens || 0) + (u.cacheWriteTokens || 0);
  var rate = pressure ? Math.round(((u.cacheReadTokens || 0) / pressure) * 100) : 0;
  state.ctx = { pressure: pressure, rate: rate, out: u.outputTokens || 0 };
  ctxBtn.textContent = '◐ ' + fmtTok(pressure) + (rate ? '·' + rate + '%' : '');
}
ctxBtn.addEventListener('click', function () {
  var c = state.ctx;
  if (!c) { toast('暂无用量数据，等一轮回复后显示'); return; }
  toast('上下文≈' + fmtTok(c.pressure) + ' tok · 缓存命中 ' + c.rate + '% · 上轮输出 ' + fmtTok(c.out));
});
function postJSON(path, body) {
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(function (r) { return r.json(); });
}

// ── 优2：模型切换真控件（P8 官方路径 · C2 居中小弹窗）────────────────────
// 键显隐由 /sessions 的 canModel 能力位驱动（宿主缺 sessionController 时隐藏，优3b 同款）。
// 弹层每次打开实时 GET /model（目录 + 当前模型），点选 POST 官方 selectModel，下一回合生效。
// 交互形态（C2 真机反馈修正）：全宽底部大 sheet → 居中小弹窗 + 半透明遮罩点击关闭；
// 列表区独立滚动（40vh 封顶）。切换协议（GET/POST selectModel）一律未动。
var modelBtn = $('modelBtn');
var modelSheet = $('modelSheet');
var modelMask = $('modelMask');
var modelPicking = false; // 防连点
function modelLabel(sel) { return sel ? sel.provider + ' / ' + sel.model : ''; }
function showModelBtn(v) { modelBtn.style.display = v ? '' : 'none'; }
function closeModelSheet() {
  modelSheet.classList.remove('show');
  modelMask.classList.remove('show');
}
modelBtn.addEventListener('click', openModelSheet);
// 遮罩点击关闭（弹窗本体阻止冒泡，避免点列表时误关）
modelMask.addEventListener('click', function (e) {
  if (e && e.target === modelMask) closeModelSheet();
});
modelSheet.addEventListener('click', function (e) {
  if (e && e.stopPropagation) e.stopPropagation();
});
function openModelSheet() {
  if (modelSheet.classList.contains('show')) return;
  $('modelCur').textContent = '读取中…';
  $('modelList').innerHTML = '';
  modelMask.classList.add('show');
  modelSheet.classList.add('show');
  fetch('/mobile-remote/model?token=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (handleAuthCode(d && d.code)) { closeModelSheet(); return; }
      if (!(d && d.ok)) {
        closeModelSheet();
        toast('模型列表加载失败：' + ((d && d.message) || '未知错误'));
        return;
      }
      renderModelSheet(d);
    })
    .catch(function () { closeModelSheet(); toast('网络错误'); });
}
function renderModelSheet(d) {
  var cur = d.current || null;
  $('modelCur').textContent = cur ? '当前：' + modelLabel(cur) : '当前：跟随电脑端默认（未读到会话模型）';
  var list = $('modelList');
  list.innerHTML = '';
  if (!d.canSwitch) {
    list.appendChild(sysLine('当前 DSH 实例不支持切换模型'));
    return;
  }
  var groups = d.providers || [];
  for (var g = 0; g < groups.length; g++) {
    var grp = groups[g] || {};
    var models = grp.models || [];
    if (models.length === 0) continue;
    appendProviderStack(list, grp, models, cur);
  }
  if (list.childElementCount === 0) list.appendChild(sysLine('模型目录为空'));
}
/**
 * 供应商堆叠段（用户需求：按供应商堆叠选择模型）——每个供应商一行头
 * （名称 + 模型数 + chevron），点击展开/收起该段模型列表；默认只展开
 * 当前模型所在的供应商，其余收起。交互模式与工作区卡片折叠同款。
 */
function appendProviderStack(list, grp, models, cur) {
  var hasCur = !!(cur && cur.provider === grp.id);
  var wrap = document.createElement('div');
  wrap.className = 'provStack' + (hasCur ? ' open' : '');
  var head = document.createElement('button');
  head.className = 'provHead';
  head.type = 'button';
  var label = document.createElement('span');
  label.className = 'provName';
  label.textContent = grp.name || grp.id;
  head.appendChild(label);
  var count = document.createElement('span');
  count.className = 'provCount';
  count.textContent = models.length + ' 个模型';
  head.appendChild(count);
  if (hasCur) {
    var curTag = document.createElement('span');
    curTag.className = 'provCur';
    curTag.textContent = '当前';
    head.appendChild(curTag);
  }
  var chev = document.createElement('span');
  chev.className = 'provChev';
  chev.textContent = wrap.classList.contains('open') ? '⌃' : '⌄';
  head.appendChild(chev);
  head.addEventListener('click', function () {
    var opening = !wrap.classList.contains('open');
    wrap.classList.toggle('open', opening);
    chev.textContent = opening ? '⌃' : '⌄';
  });
  wrap.appendChild(head);
  var body = document.createElement('div');
  body.className = 'provBody';
  for (var i = 0; i < models.length; i++) {
    appendModelOption(body, grp.id, models[i], cur);
  }
  wrap.appendChild(body);
  list.appendChild(wrap);
}
/** 单个模型选项（44px 行，当前生效项描边 + 对勾）；点选即对绑定会话切换（官方 selectModel）。 */
function appendModelOption(list, providerId, m, cur) {
  var mid = m && m.id ? m.id : '';
  if (!mid) return;
  var isCur = !!(cur && cur.provider === providerId && cur.model === mid);
  var btn = document.createElement('button');
  btn.className = 'modelOpt' + (isCur ? ' cur' : '');
  var name = document.createElement('span');
  name.className = 'moName';
  name.textContent = (m.name && m.name !== mid) ? (m.name + '（' + mid + '）') : mid;
  btn.appendChild(name);
  if (isCur) {
    var check = document.createElement('span');
    check.className = 'moCheck';
    check.textContent = '✓';
    btn.appendChild(check);
  }
  btn.addEventListener('click', function () { pickModel(providerId, mid); });
  list.appendChild(btn);
}
function pickModel(provider, model) {
  if (modelPicking) return;
  modelPicking = true;
  postJSON('/mobile-remote/model', { token: token, provider: provider, model: model })
    .then(function (r) {
      modelPicking = false;
      if (handleAuthCode(r && r.code)) return;
      if (r && r.ok) {
        closeModelSheet(); // 点选即关闭 + toast 确认（不等待下一回合）
        toast('已切换：' + modelLabel(r.selected) + '，下一回合生效');
      } else {
        toast((r && r.message) || '切换失败');
      }
    })
    .catch(function () { modelPicking = false; toast('网络错误'); });
}

// ── 视图切换（阶段 4）：首页 ↔ 会话，双向保存/恢复滚动位置 ───────────────
function showView(name) {
  var prev = state.view;
  if (prev === 'chat' && prev !== name && state.sessionId) {
    state.chatScrollBySid[state.sessionId] = streamEl.scrollTop; // 离开会话：记滚动位置
  }
  if (prev === 'home' && prev !== name) {
    state.homeScroll = homeEl.scrollTop; // 离开首页：记滚动位置
  }
  state.view = name;
  try { sessionStorage.setItem('mr-view', name); } catch (e) {} // 息屏整页重载回到原视图
  document.body.classList.toggle('view-home', name === 'home');
  document.body.classList.toggle('view-chat', name === 'chat');
  if (name === 'home') {
    homeEl.scrollTop = state.homeScroll || 0;
    if (state.homeDirty) renderHome();
    fetchSessions(false); // 节流刷新（3s 内重复进入不重复请求）
  } else {
    restoreChatScroll();
  }
}
/** 回到会话视图：有滚动记忆（往返场景）则恢复，否则落到底部（切换/重载场景）。 */
function restoreChatScroll() {
  var sid = state.sessionId;
  var saved = sid ? state.chatScrollBySid[sid] : null;
  requestAnimationFrame(function () {
    if (typeof saved === 'number') streamEl.scrollTop = saved;
    else streamEl.scrollTop = streamEl.scrollHeight;
  });
}
function clearStream() {
  streamEl.innerHTML = '';
  streamingBubbles = {};
  toolLines = {};
  thinkBlocks = {}; // 思考块随消息流一起清（切会话/重绑）
  state.nearBottom = true;
  $('newMsg').classList.remove('show');
  $('actionPill').classList.remove('show');
}
/** 会话视图顶栏标题：优先标题快照，缺数据时回退 cwd/短 id（首页数据到位后自动更新）。 */
function refreshChatTitle() {
  var sid = state.sessionId;
  if (!sid) { $('chatTitle').textContent = '未绑定会话'; return; }
  var it = state.sessionsById[sid];
  $('chatTitle').textContent = it ? sessionTitle(it) : ('会话 ' + shortSid(sid));
}
function setSession(sid, cwd) {
  state.sessionId = sid || null;
  state.sessionCwd = cwd || '';
  $('input').placeholder = sid ? '发消息给当前会话…' : '未绑定会话，回首页选择';
  refreshChatTitle();
}

// ── 首页：工作区卡片（cwd 分组/折叠/汇总）───────────────────────────────
/** 拉取会话列表（/sessions）：force 绕过 3s 节流（刷新按钮/SSE 重连成功时）。 */
function fetchSessions(force) {
  var now = Date.now();
  if (!force && now - state.lastHomeFetch < 3000) return;
  state.lastHomeFetch = now;
  var btn = $('refreshBtn');
  btn.disabled = true;
  if (state.homeDirty && homeListEl.childElementCount === 0) {
    homeListEl.appendChild(sysLine('加载中…'));
  }
  fetch('/mobile-remote/sessions?token=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      btn.disabled = false;
      if (handleAuthCode(d && d.code)) return;
      if (d && d.ok) {
        state.pinned = (d.pinnedSession || null);
        $('newBtn').style.display = d.canNew ? '' : 'none'; // 优3b：能力探测显隐
        showModelBtn(d.canModel === true); // 优2：模型键能力探测显隐
        ingestSessions(d.sessions || []);
        renderFollowRow();
        if (state.view === 'home') renderHome();
        refreshChatTitle(); // 标题数据可能刚到位
      } else {
        toast('会话列表加载失败：' + ((d && d.message) || '未知错误'));
      }
    })
    .catch(function () {
      btn.disabled = false;
      // 无任何数据时给出可操作的失败提示；已有旧数据则保留展示
      if (state.view === 'home' && state.homeDirty) {
        homeListEl.innerHTML = '';
        homeListEl.appendChild(sysLine('加载失败，点「刷新」重试'));
      }
    });
}
function ingestSessions(list) {
  var byId = {};
  for (var i = 0; i < list.length; i++) {
    var it = list[i] || {};
    if (!it.id) continue;
    byId[it.id] = it;
  }
  state.sessionsById = byId;
  state.homeDirty = true;
}
/** 按 cwd 分组：组内/组间按最近活动倒序，无 cwd 归入「未分组」且排最后（spec 止损）。 */
function groupSessions(list) {
  var order = [];
  var byCwd = {};
  for (var i = 0; i < list.length; i++) {
    var it = list[i];
    var key = typeof it.cwd === 'string' ? it.cwd : '';
    var g = byCwd[key];
    if (!g) {
      g = { cwd: key, name: cwdBasename(key), items: [], lastAt: 0 };
      byCwd[key] = g;
      order.push(g);
    }
    g.items.push(it);
    var t = it.lastAt || it.humanAt || it.createdAt || 0;
    if (t > g.lastAt) g.lastAt = t;
  }
  for (var j = 0; j < order.length; j++) {
    order[j].items.sort(function (a, b) {
      return (b.lastAt || b.humanAt || b.createdAt || 0) - (a.lastAt || a.humanAt || a.createdAt || 0);
    });
  }
  order.sort(function (a, b) {
    if (a.cwd === '' && b.cwd === '') return 0;
    if (a.cwd === '') return 1;
    if (b.cwd === '') return -1;
    return b.lastAt - a.lastAt;
  });
  return order;
}
function renderFollowRow() {
  $('followRow').style.display = state.pinned ? 'block' : 'none';
}
/** 重建首页列表（全量 DOM 构建，100 条上限下重建开销可忽略）。 */
function renderHome() {
  state.homeDirty = false;
  var keep = homeEl.scrollTop; // 重建前后保持视口，增量数据到达时不跳动
  homeListEl.innerHTML = '';
  state.rowChips = {};
  state.rowRows = {};
  var list = [];
  for (var k in state.sessionsById) list.push(state.sessionsById[k]);
  if (list.length === 0) {
    homeListEl.appendChild(sysLine('暂无会话：电脑端产生会话后会出现在这里'));
    return;
  }
  if (state.homeMode === 'time') {
    // 时间线（优3）：纯前端重排同一份数据，后端零改动
    var days = timeSessions(list);
    for (var d = 0; d < days.length; d++) homeListEl.appendChild(buildDayCard(days[d]));
    $('sumCount').textContent = list.length + ' 个任务 · ' + days.length + ' 天内有活动';
  } else {
    var groups = groupSessions(list);
    for (var g = 0; g < groups.length; g++) homeListEl.appendChild(buildWsCard(groups[g]));
    $('sumCount').textContent = groups.length + ' 个工作区 · ' + list.length + ' 个任务';
  }
  homeEl.scrollTop = Math.min(keep, homeEl.scrollHeight);
}
/** 自然日标签：今天/昨天/近一周（周X）/更早用完整日期。 */
function fmtDayLabel(ts) {
  var d = new Date(ts);
  var now = new Date();
  var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var day = 24 * 3600 * 1000;
  var md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
  if (ts >= midnight) return '今天 · ' + md;
  if (ts >= midnight - day) return '昨天 · ' + md;
  if (ts >= midnight - 6 * day) return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()] + ' · ' + md;
  return d.getFullYear() + '年' + md;
}
/** 时间线分组（优3）：全部会话按最近活动倒序，按自然日分组；纯前端重排现有数据。 */
function timeSessions(list) {
  var arr = list.slice();
  arr.sort(function (a, b) {
    return (b.lastAt || b.humanAt || b.createdAt || 0) - (a.lastAt || a.humanAt || a.createdAt || 0);
  });
  var groups = [];
  var byDay = {};
  for (var i = 0; i < arr.length; i++) {
    var it = arr[i];
    var t = it.lastAt || it.humanAt || it.createdAt || 0;
    var label = t ? fmtDayLabel(t) : '日期未知';
    var g = byDay[label];
    if (!g) { g = { label: label, items: [] }; byDay[label] = g; groups.push(g); }
    g.items.push(it); // arr 已倒序，组内自然保持倒序
  }
  return groups;
}
/** 时间线日期分区卡：头部（日期 + 任务数 + 折叠）+ 任务行；折叠键 day:<标签>。 */
function buildDayCard(g) {
  var card = document.createElement('div');
  card.className = 'wsCard';
  var head = document.createElement('div');
  head.className = 'wsHead';
  var main = document.createElement('div');
  main.className = 'wsMain';
  var nm = document.createElement('div');
  nm.className = 'wsName';
  nm.textContent = g.label;
  main.appendChild(nm);
  var side = document.createElement('div');
  side.className = 'wsSide';
  var cnt = document.createElement('div');
  cnt.className = 'wsCount';
  cnt.textContent = g.items.length + ' 个任务';
  side.appendChild(cnt);
  var chev = document.createElement('span');
  chev.className = 'wsChevron';
  chev.textContent = '▾';
  head.appendChild(main);
  head.appendChild(side);
  head.appendChild(chev);
  var body = document.createElement('div');
  body.className = 'wsBody';
  for (var i = 0; i < g.items.length; i++) body.appendChild(buildTaskRow(g.items[i]));
  card.appendChild(head);
  card.appendChild(body);
  var key = 'day:' + g.label;
  if (state.foldMap[key]) {
    card.classList.add('folded');
    chev.textContent = '▸';
  }
  head.addEventListener('click', function () {
    var folded = card.classList.toggle('folded');
    chev.textContent = folded ? '▸' : '▾';
    if (folded) state.foldMap[key] = true;
    else delete state.foldMap[key];
    saveFolds();
  });
  return card;
}
/** 首页视图切换（优3）：记忆到 localStorage，切换即重建列表。 */
function setHomeMode(mode, skipRender) {
  state.homeMode = mode === 'time' ? 'time' : 'ws';
  $('segWs').classList.toggle('on', state.homeMode !== 'time');
  $('segTime').classList.toggle('on', state.homeMode === 'time');
  try { localStorage.setItem('mr-home-mode', state.homeMode); } catch (e) {}
  if (!skipRender && state.view === 'home') renderHome();
}
$('segWs').addEventListener('click', function () { setHomeMode('ws'); });
$('segTime').addEventListener('click', function () { setHomeMode('time'); });
function buildWsCard(g) {
  var card = document.createElement('div');
  card.className = 'wsCard';
  var head = document.createElement('div');
  head.className = 'wsHead';
  var main = document.createElement('div');
  main.className = 'wsMain';
  var nm = document.createElement('div');
  nm.className = 'wsName';
  nm.textContent = g.name;
  var pth = document.createElement('div');
  pth.className = 'wsPath';
  pth.textContent = g.cwd || '（无目录信息）';
  main.appendChild(nm);
  main.appendChild(pth);
  var side = document.createElement('div');
  side.className = 'wsSide';
  var cnt = document.createElement('div');
  cnt.className = 'wsCount';
  cnt.textContent = g.items.length + ' 个任务';
  var upd = document.createElement('div');
  upd.className = 'wsUpd';
  upd.textContent = g.lastAt ? fmtRel(g.lastAt) : '';
  side.appendChild(cnt);
  side.appendChild(upd);
  var chev = document.createElement('span');
  chev.className = 'wsChevron';
  chev.textContent = '▾';
  head.appendChild(main);
  head.appendChild(side);
  head.appendChild(chev);
  var body = document.createElement('div');
  body.className = 'wsBody';
  for (var i = 0; i < g.items.length; i++) body.appendChild(buildTaskRow(g.items[i]));
  card.appendChild(head);
  card.appendChild(body);
  if (state.foldMap[g.cwd]) {
    card.classList.add('folded');
    chev.textContent = '▸';
  }
  // 折叠/展开：按 cwd 记忆，localStorage 持久化（跨重载保持）
  head.addEventListener('click', function () {
    var folded = card.classList.toggle('folded');
    chev.textContent = folded ? '▸' : '▾';
    if (folded) state.foldMap[g.cwd] = true;
    else delete state.foldMap[g.cwd];
    saveFolds();
  });
  return card;
}
function buildTaskRow(it) {
  var row = document.createElement('div');
  row.className = 'taskRow' + (it.bound ? ' bound' : '');
  var main = document.createElement('div');
  main.className = 'taskMain';
  var tt = document.createElement('div');
  tt.className = 'taskTitle';
  tt.textContent = sessionTitle(it);
  var ts = document.createElement('div');
  ts.className = 'taskSub';
  ts.textContent = fmtRel(it.lastAt || it.humanAt || it.createdAt)
    + (it.persisted && !it.live ? ' · 未在运行' : '');
  main.appendChild(tt);
  main.appendChild(ts);
  var chip = document.createElement('span');
  chip.className = 'tchip' + (statusChipCls(it.status) ? ' ' + statusChipCls(it.status) : '');
  chip.textContent = statusLabel(it.status);
  row.appendChild(main);
  row.appendChild(chip);
  row.addEventListener('click', function () { openSession(it.id); });
  state.rowChips[it.id] = chip; // SSE 状态帧增量更新用
  state.rowRows[it.id] = row;   // 绑定高亮增量更新用
  return row;
}
/** SSE 状态帧 → 首页对应任务行胶囊增量更新（无需整表重建）。 */
function updateHomeRowStatus(sid, st) {
  if (!sid || !st) return;
  var it = state.sessionsById[sid];
  if (it) it.status = st;
  var chip = state.rowChips[sid];
  if (chip) {
    chip.textContent = statusLabel(st);
    chip.className = 'tchip' + (statusChipCls(st) ? ' ' + statusChipCls(st) : '');
  }
}
/** 绑定变化 → 首页高亮行切换。 */
function updateHomeBound() {
  var rows = state.rowRows;
  for (var sid in rows) {
    rows[sid].classList.toggle('bound', sid === state.sessionId);
  }
}
function saveFolds() {
  var arr = [];
  for (var k in state.foldMap) if (state.foldMap[k]) arr.push(k);
  try { localStorage.setItem('mr-fold', JSON.stringify(arr)); } catch (e) {}
}
/** 任务行/跟随行点击 → 进入会话视图。已绑定会话直接切视图（保留流与滚动）；
 *  其余走 POST /switch（服务端确认即先切视图兜底，bound 帧到达后再清流补发）。 */
function openSession(sid) {
  if (state.sessionId === sid) { showView('chat'); return; }
  postJSON('/mobile-remote/switch', { token: token, sessionId: sid })
    .then(function (r) {
      if (handleAuthCode(r && r.code)) return;
      if (!(r && r.ok)) { toast('切换失败：' + ((r && r.message) || '未知错误')); return; }
      if (!sid) { state.pinned = null; renderFollowRow(); } // 跟随电脑：清除钉住
      // SSE 短暂断开时 bound 帧可能收不到，以 POST 响应兜底：先更新绑定并进入会话视图
      setSession(r.sessionId, r.cwd);
      updateHomeBound();
      showView('chat');
    })
    .catch(function () { toast('网络错误'); });
}
/** ＋新建（优3b，P10 证实路径）：服务端建会话 + 自动钉住，成功后切入会话视图。 */
function createSession() {
  var btn = $('newBtn');
  if (btn.disabled) return; // 防连点
  btn.disabled = true;
  postJSON('/mobile-remote/new', { token: token })
    .then(function (r) {
      btn.disabled = false;
      if (handleAuthCode(r && r.code)) return;
      if (!(r && r.ok)) { toast('新建失败：' + ((r && r.message) || '未知错误')); return; }
      state.pinned = r.sessionId; // 服务端已钉住，页面同步（跟随行不显示）
      renderFollowRow();
      setSession(r.sessionId, r.cwd);
      updateHomeBound();
      showView('chat');
      toast('已新建会话，发消息即可开始');
      fetchSessions(true); // 列表补上新会话（绕过节流）
    })
    .catch(function () { btn.disabled = false; toast('网络错误'); });
}
$('newBtn').addEventListener('click', createSession);

// ── 连接管理 ─────────────────────────────────────────────────────────────
function setConn(cls, text) {
  var dots = document.querySelectorAll('.connDot');
  for (var i = 0; i < dots.length; i++) dots[i].className = 'connDot ' + (cls || '');
  $('connText').textContent = text;
  $('sumConn').textContent = text === '已连接' ? '已连接到 DSH 实例' : text;
}
function setAgent(status, errorMsg) {
  var prev = state.agentStatus;
  state.agentStatus = status || null;
  // 四态：运行中/空闲/完成/错误（done 为启发式映射：idle 且上一回合正常收尾）。
  var label = status === 'running' ? '运行中'
    : status === 'done' ? '完成'
    : status === 'error' ? '错误'
    : (status ? '空闲' : '无会话');
  var cls = 'jsAgentChip chip'
    + (status === 'running' ? ' run' : '')
    + (status === 'error' ? ' bad' : '')
    + (status === 'done' ? ' done' : '');
  var chips = document.querySelectorAll('.jsAgentChip');
  for (var i = 0; i < chips.length; i++) {
    chips[i].textContent = label;
    chips[i].className = cls;
  }
  if (status === 'error' && prev !== 'error') {
    toast('会话出错' + (errorMsg ? '：' + errorMsg : ''));
  }
  if (status !== 'running') hideActionPill(); // 回合结束：当前动作 pill 收起
}

// ── 配对失效处理（阶段 2，对齐 ZCode：过期需电脑端重新生成）──────────────
function retryConnect() {
  setConn('bad', '连接断开，' + Math.round(state.backoff / 1000) + 's 后重连');
  var wait = state.backoff * (0.7 + Math.random() * 0.6); // ±30% 抖动，避免重连同步风暴
  state.backoff = Math.min(state.backoff * 2, 10000);
  setTimeout(connect, wait);
}
/** 配对失效（过期/被重置）：停掉自动重连，展示原因与重新配对指引。 */
function pairFailed(code) {
  state.noAuto = true;
  if (state.es) { try { state.es.close(); } catch (e) {} }
  setConn('bad', code === 'token-expired' ? '配对已过期' : '配对码无效');
  $('pairBannerText').textContent = code === 'token-expired'
    ? '配对已过期：请在电脑端「移动端远程」设置页重新生成配对码，再用新二维码/链接打开本页。'
    : '配对码无效：链接已失效或已被重置。请在电脑端重新生成配对码后，用新链接打开本页。';
  $('pairBanner').classList.add('show');
}
/** POST 响应里的失效原因码 → 统一转入失效横幅；返回 true 表示已处理。 */
function handleAuthCode(code) {
  if (code === 'bad-token' || code === 'token-expired') { pairFailed(code); return true; }
  return false;
}

function connect() {
  if (state.es) { try { state.es.close(); } catch (e) {} }
  state.lastPingAt = Date.now(); // 起算宽限：等首个 ping 到达
  setConn('', '连接中…');
  var url = '/mobile-remote/sse?token=' + encodeURIComponent(token) + '&since=' + state.seq;
  var es = new EventSource(url);
  state.es = es;
  es.addEventListener('open', function () {
    state.backoff = 1000;
    state.lastPingAt = Date.now();
    setConn('ok', '已连接');
    $('stoppedBanner').classList.remove('show');
    $('replacedBanner').classList.remove('show');
  });
  // 服务器心跳（15s 一次）：EventSource 收不到注释行，具名 ping 是唯一可靠信号。
  es.addEventListener('ping', function () {
    state.lastPingAt = Date.now();
  });
  es.addEventListener('hello', function (e) {
    var d = JSON.parse(e.data);
    state.throttleSec = d.throttleSec || 2;
    state.waitSec = d.waitSec || 120;
    applyShield(d.shield || 'ask'); // 盾牌档位以服务器为准（重连/重载兜底同步）
    // 服务器重启（epoch 变化）→ 全局事件号已归零，旧游标作废。
    if (state.epoch && d.epoch && state.epoch !== d.epoch) state.seq = 0;
    state.epoch = d.epoch || state.epoch;
    if (typeof d.seq === 'number' && d.seq > state.seq) state.seq = d.seq;
    saveCursor();
    setSession(d.sessionId, d.cwd);
    setAgent(d.status);
    fetchSessions(true); // 连接建立/重连成功：刷新首页数据（标题/状态/钉住均可能变化）
  });
  es.addEventListener('bound', function (e) {
    var d = JSON.parse(e.data);
    var isSwitch = d.switched === true;
    var oldSid = state.sessionId;
    setSession(d.sessionId, d.cwd);
    if (isSwitch) {
      // 手动切换：清空旧会话的消息流与滚动记忆，随后服务器补发新会话近期帧
      if (oldSid) delete state.chatScrollBySid[oldSid];
      clearStream();
      showView('chat');
    }
    addSys(isSwitch ? ('已切换到会话 ' + shortSid(d.sessionId) + (d.live === false ? '（该会话未在运行，仅显示之后的新事件）' : '')) : '已绑定电脑当前会话');
    updateHomeBound();
  });
  es.addEventListener('session', function (e) {
    var d = JSON.parse(e.data);
    var idNum = parseInt(e.lastEventId, 10);
    if (Number.isFinite(idNum) && idNum > state.seq) { state.seq = idNum; saveCursor(); }
    handleSession(d);
  });
  // 历史回读（C1 feat(history)）：进入/切换会话时缓冲不足，服务器从
  // readSession 拉最近历史。渲染为顶部「历史」区（与 live 流分隔），
  // 在已渲染的 live 帧之上前插；之后 live 流无缝衔接（决策 12 语义不变）。
  es.addEventListener('history', function (e) {
    renderHistoryFrame(JSON.parse(e.data));
  });
  es.addEventListener('status', function (e) {
    var d = JSON.parse(e.data);
    setAgent(d.status, d.error);
    updateHomeRowStatus(d.sessionId, d.status); // 首页任务行胶囊同步
  });
  es.addEventListener('approval', function (e) {
    pushApproval(JSON.parse(e.data));
  });
  es.addEventListener('approval_result', function (e) {
    var d = JSON.parse(e.data);
    settleApprovalLocal(d.id);
    if (d.via === 'timeout') { addSys('⏱ 审批超时，已转回电脑端'); toast('审批超时，转回电脑端'); }
    if (d.via === 'stop' || d.via === 'disconnect') addSys('⛔ 审批已中断（' + d.via + '）');
    // 盾牌自动代答（无 id，仅系统行提示；P3 语义：插件决策即终局）
    if (d.via === 'shield-allow') addSys('🛡 盾牌已自动放行');
    if (d.via === 'shield-deny') addSys('🛡 盾牌已自动拒绝');
  });
  // 盾牌档位变化（手机端切换后服务器的确认广播）
  es.addEventListener('shield', function (e) {
    applyShield(JSON.parse(e.data).mode);
  });
  es.addEventListener('replaced', function () {
    state.noAuto = true;
    es.close();
    setConn('bad', '连接被其他设备顶替');
    $('replacedBanner').classList.add('show');
  });
  es.addEventListener('stopped', function () {
    state.noAuto = true;
    es.close();
    setConn('bad', '远程已停止');
    $('stoppedBanner').classList.add('show');
  });
  es.addEventListener('error', function () {
    es.close();
    if (state.noAuto) { setConn('bad', '连接未恢复'); return; }
    // 先探测配对状态：已过期/被重置则停住并指引重新配对；探测不通
    // （网络断、服务器重启）才走指数退避重连。
    fetch('/mobile-remote/paircheck?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); })
      .then(function (d) {
        if (d && d.ok === false && (d.code === 'bad-token' || d.code === 'token-expired')) pairFailed(d.code);
        else retryConnect();
      })
      .catch(function () { retryConnect(); });
  });
}

/** 历史区渲染（C1 feat(history)）：SSE history 帧 → 顶部「历史」分隔条 + 定稿消息。
 *  只读定稿：user 气泡 + assistant 定稿（含 reasoning 思考块）；迟到的
 *  历史（已切走/已渲染过）直接丢弃，不与 live 流重复。 */
function renderHistoryFrame(d) {
  if (!d || d.sessionId !== state.sessionId) return; // 迟到的历史帧（已切走）：丢弃
  var msgs = Array.isArray(d.messages) ? d.messages : [];
  if (!msgs.length) return;
  if (document.getElementById('histSep')) return; // 已有历史区：去重
  var sep = document.createElement('div');
  sep.id = 'histSep';
  sep.className = 'sys';
  sep.textContent = '—— 历史' + (d.more ? '（更早未显示）' : '') + ' ——';
  // 分隔条先落在流尾（live 帧之后），历史节点随后 append 在其后面，
  // 最后整组（分隔条+历史）移动到流顶——live 帧顺序不动。
  streamEl.appendChild(sep);
  var sepIdx = Array.prototype.indexOf.call(streamEl.children, sep);
  for (var i = 0; i < msgs.length; i++) {
    var m = msgs[i] || {};
    var data = m.data || {};
    if (m.type === 'user/message') {
      var src = data.source || {};
      var who = src.kind === 'plugin' ? '📱 ' + (src.plugin || '插件') : '💻 电脑';
      addBubble('me', contentText(data.content || (data.message && data.message.content)),
        who + ' · ' + (m.time ? fmtTimeOf(new Date(m.time)) : ''), false);
    } else if (m.type === 'assistant/message') {
      var content = data.message && data.message.content;
      settleThinking(data.turn, data.step, reasoningTextOf(content));
      finishStreaming(data.turn, data.step, contentText(content));
    }
  }
  // 本轮新增节点（分隔条起）目前挤在 live 帧之后，整组平移到流顶：
  // 保持组内相对顺序，历史区成为流的顶部，live 帧原序原位。
  var added = streamEl.children.slice(sepIdx);
  for (var k = 0; k < added.length; k++) streamEl.insertBefore(added[k], streamEl.firstChild);
}
$('newMsg').addEventListener('click', function () {
  streamEl.scrollTop = streamEl.scrollHeight;
  $('newMsg').classList.remove('show');
});
// 离开底部即显示 ↓FAB（回到底部入口），贴底自动隐藏
streamEl.addEventListener('scroll', function () {
  state.nearBottom = nearBottom();
  $('newMsg').classList.toggle('show', !state.nearBottom);
});
$('backBtn').addEventListener('click', function () { showView('home'); });
$('refreshBtn').addEventListener('click', function () { fetchSessions(true); });
$('followRow').addEventListener('click', function () { openSession(''); });
$('introClose').addEventListener('click', function () {
  $('introCard').style.display = 'none';
  try { localStorage.setItem('mr-intro', '1'); } catch (e) {}
});
$('resumeBtn').addEventListener('click', function () {
  state.noAuto = false;
  $('stoppedBanner').classList.remove('show');
  connect();
});
$('takeoverBtn').addEventListener('click', function () {
  state.noAuto = false;
  $('replacedBanner').classList.remove('show');
  connect();
});
$('pairRetryBtn').addEventListener('click', function () {
  state.noAuto = false;
  $('pairBanner').classList.remove('show');
  state.backoff = 1000;
  connect();
});
// 回前台立即检查连接（部分浏览器不触发 EventSource 自动重连）。
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (state.noAuto) return;
  if (!state.es || state.es.readyState === 2) {
    state.backoff = 1000;
    connect();
  }
});
// 网络恢复（飞行模式关闭/Wi-Fi 重连）立即重连，不等退避计时。
window.addEventListener('online', function () {
  if (state.noAuto) return;
  state.backoff = 1000;
  if (!state.es || state.es.readyState !== 1) connect();
});
// 半开连接看门狗（阶段 2）：连接显示 OPEN 但 45s 无任何心跳 → 判定链路已死
// （弱网切换、NAT 超时等），主动断开立即重连。周期 10s，宽限覆盖 15s 心跳间隔。
setInterval(function () {
  if (state.noAuto) return;
  if (!state.es || state.es.readyState !== 1) return; // 非 OPEN：EventSource 自身重连接管
  if (Date.now() - state.lastPingAt > 45000) {
    toast('连接超时，正在重连…');
    try { state.es.close(); } catch (e) {}
    state.backoff = 1000;
    connect();
  }
}, 10000);

// ── 启动：视图恢复 + 首次数据拉取 + 长连接 ───────────────────────────────
if (!token) {
  document.body.innerHTML = '<div id="hintBar">链接缺少配对码，请通过电脑端设置页的二维码打开。</div>';
} else {
  // 折叠记忆恢复（localStorage）
  try {
    var folds = JSON.parse(localStorage.getItem('mr-fold') || '[]');
    for (var fi = 0; fi < folds.length; fi++) {
      if (typeof folds[fi] === 'string') state.foldMap[folds[fi]] = true;
    }
  } catch (e) {}
  // 首页视图恢复（优3）：上次用的时间线/工作区视图跨重载保持
  var savedMode = 'ws';
  try { savedMode = localStorage.getItem('mr-home-mode') === 'time' ? 'time' : 'ws'; } catch (e) {}
  setHomeMode(savedMode, true);
  // 首次进入说明卡：关闭一次后不再出现（一次性）
  var introDismissed = false;
  try { introDismissed = localStorage.getItem('mr-intro') === '1'; } catch (e) {}
  if (introDismissed) $('introCard').style.display = 'none';
  // 视图恢复：息屏整页重载（P5 主恢复路径）回到离开时的视图
  var initialView = 'home';
  try { if (sessionStorage.getItem('mr-view') === 'chat') initialView = 'chat'; } catch (e) {}
  showView(initialView);
  connect();
}
</script>
</body>
